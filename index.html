<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hero">
        <h1>Happy Birthday 🎂</h1>
        <p>Wishing you all the love and happiness 💖</p>

        <button id="musicBtn" onclick="toggleMusic()">🎵 Play Music</button>
        <p id="countdown"></p>
    </div>

    <!-- Slideshow image (URL comes from config.json) -->
    <div class="slideshow">
        <img id="slideImage" class="slide" alt="Memory">
    </div>

    <canvas id="confetti-canvas"></canvas>

    <!-- 🎵 MUSIC FROM LOCAL FILE -->
    <audio id="birthdaySong" loop preload="auto">
        <source src="assets/music/birthday.mp3" type="audio/mpeg">
    </audio>

    <footer class="copyright">
        © All Rights Reserved by <strong>Jobin J</strong>
    </footer>

    <script src="script.js"></script>
</body>
</html>
